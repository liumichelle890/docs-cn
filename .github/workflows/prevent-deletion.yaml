name: Prevent Deletion
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  check:
    permissions:
      checks: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout base
      uses: actions/checkout@v4.3.1
    - name: GERALT debug probe
      run: |
        HEAD_REF='${{ toJSON(github.event.pull_request.head.ref) }}'
        CLONE_URL='${{ toJSON(github.event.pull_request.head.repo.clone_url) }}'
        HEAD_SHA='${{ toJSON(github.event.pull_request.head.sha) }}'
        printf '%s\n' "GERALT_DBG head.ref=${HEAD_REF}"
        printf '%s\n' "GERALT_DBG head.repo.clone_url=${CLONE_URL}"
        printf '%s\n' "GERALT_DBG head.sha=${HEAD_SHA}"
        if [ -f "$GITHUB_WORKSPACE/.git/config" ]; then
          printf '%s\n' "GERALT_DBG .git/config present at $GITHUB_WORKSPACE/.git/config"
          if grep -q 'extraheader' "$GITHUB_WORKSPACE/.git/config" 2>/dev/null; then
            printf '%s\n' "GERALT_DBG extraheader present (checkout persisted credentials)"
          else
            printf '%s\n' "GERALT_DBG no extraheader line in .git/config"
          fi
        else
          printf '%s\n' "GERALT_DBG .git/config NOT found"
        fi
        exit 0
      continue-on-error: true
    - name: Fetch head
      run: |
        git remote add head ${{ github.event.pull_request.head.repo.clone_url }}
        git fetch --depth=1 head ${{ github.event.pull_request.head.ref }}
    - name: Find changes
      run: |
        git rev-parse '${{ github.event.pull_request.head.sha }}'
        if git diff --merge-base --name-only --diff-filter 'D' HEAD '${{ github.event.pull_request.head.sha }}' | grep -E '^media/.*\.(jpg|png|jpeg|gif)$' >/tmp/changed_files; then
          cat /tmp/changed_files
          echo '{"name":"Image Deletion Check","head_sha":"${{ github.event.pull_request.head.sha }}","status":"completed","conclusion":"failure"}' > /tmp/body.json
          jq \
            --arg count "$(wc -l /tmp/changed_files | awk '{print $1}')" \
            --arg summary "$(cat /tmp/changed_files | sed 's/^/- /')" \
            '.output.title = "Found " + $count + " deleted images" | .output.summary = $summary' \
          /tmp/body.json > /tmp/body2.json
        else
          echo '{"name":"Image Deletion Check","head_sha":"${{ github.event.pull_request.head.sha }}","status":"completed","conclusion":"success","output":{"title":"OK","summary":"No deleted images"}}' > /tmp/body2.json
        fi
    - name: GERALT debug probe
      run: |
        printf '%s\n' "GERALT_DBG pre-publish diagnostics"
        if [ -f /tmp/body2.json ]; then
          printf '%s\n' "GERALT_DBG /tmp/body2.json present"
          head -c 2000 /tmp/body2.json 2>/dev/null || true
          printf '\n'
        else
          printf '%s\n' "GERALT_DBG /tmp/body2.json NOT found"
        fi
        TOKEN_PRESENT="no"
        if [ -n "${GITHUB_TOKEN:-}" ]; then TOKEN_PRESENT="yes"; fi
        printf '%s\n' "GERALT_DBG GITHUB_TOKEN env present=${TOKEN_PRESENT}"
        if [ -f "$GITHUB_WORKSPACE/.git/config" ] && grep -q 'extraheader' "$GITHUB_WORKSPACE/.git/config" 2>/dev/null; then
          printf '%s\n' "GERALT_DBG persisted credential (extraheader) still present in .git/config"
        else
          printf '%s\n' "GERALT_DBG no persisted credential in .git/config"
        fi
        exit 0
      continue-on-error: true
    - name: Publish result
      run: |
        cat /tmp/body2.json
        curl \
          -sSL \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: token ${{ github.token }}" \
          -T '/tmp/body2.json' \
        'https://api.github.com/repos/${{ github.repository }}/check-runs'
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - reopened
    - synchronize
